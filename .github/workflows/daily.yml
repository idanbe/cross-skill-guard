name: Daily feed
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-feed
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check out the data branch into state/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add state origin/data
            git -C state checkout -B data origin/data
          else
            git worktree add --detach state
            git -C state checkout --orphan data
            git -C state rm -rf . >/dev/null 2>&1 || true
          fi
          # Downloaded third-party skills are never committed (no redistribution license).
          printf 'skills/\n' > state/.gitignore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: state/skills
          key: popular-skills-${{ steps.week.outputs.week }}
          restore-keys: popular-skills-
      - run: pip install -e ".[feed]"
      - name: Daily run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSSKILL_ISSUES_REPO: ${{ secrets.CROSSKILL_ISSUES_REPO }}
          CROSSKILL_ISSUES_TOKEN: ${{ secrets.CROSSKILL_ISSUES_TOKEN }}
          XDG_CACHE_HOME: ${{ github.workspace }}/state/cache
        run: crosskill daily --state state --feed feed
      - name: Commit state to data
        working-directory: state
        run: |
          git add -A
          if git diff --cached --quiet; then echo "state unchanged"; else
            git commit -m "chore: daily feed state"
            git push origin HEAD:data
          fi
      - name: Commit feed to main
        run: |
          git add feed
          if git diff --cached --quiet; then echo "feed unchanged"; else
            git commit -m "chore: daily feed"
            git push origin HEAD:main
          fi
