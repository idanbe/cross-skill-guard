name: publish report
# A user shares a finding from `crosskill scan` as an issue. Adding the `approve` label (only
# people with triage access can) publishes it to feed/ and closes the issue.
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: feed-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.label.name == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Publish
        # The issue body is untrusted: it goes through an env var and is only parsed as JSON.
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          crosskill publish-report "$RUNNER_TEMP/body.md" --issue "$ISSUE_URL" --feed feed > "$RUNNER_TEMP/id.txt"
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          git diff --cached --quiet && exit 0
          git commit -m "feed: publish $(cat "$RUNNER_TEMP/id.txt")"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Published as $(cat "$RUNNER_TEMP/id.txt")."
