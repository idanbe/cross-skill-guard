[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosskill"
version = "0.0.1"
description = "Find dangerous combinations of skills, MCP servers and permissions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "clingo>=5.7", "bashlex>=0.18", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
crosskill = "crosskill.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crosskill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
