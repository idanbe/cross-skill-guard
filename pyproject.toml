[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosskill"
version = "0.0.1"
description = "Find dangerous combinations of skills, MCP servers and permissions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# langfuse<5: SDK 5 posts score arrays to /api/public/scores, which the local v4.13 server rejects.
dependencies = ["typer>=0.12", "clingo>=5.7", "bashlex>=0.18", "pyyaml>=6", "pydantic>=2", "openai>=3", "langfuse>=4.13,<5", "python-statemachine>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
crosskill = "crosskill.cli:app"
crosskill-guard = "crosskill.guard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crosskill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
